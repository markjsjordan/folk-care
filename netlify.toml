# Netlify deployment configuration
# Deploys the Folk Care Showcase static site to Netlify
# Triggers on pushes to production branch

[build]
  # Use the main web app build output (NOT showcase)
  # Cache buster: 2026-09-27-web-app-deployment
  base = "."
  command = "turbo run build --filter @folkcare/web"
  publish = "packages/web/dist"

[build.environment]
  # Build environment variables
  NODE_VERSION = "22.x"
  NPM_VERSION = "10.x"

# Redirects for SPA routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Cache headers for static assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
